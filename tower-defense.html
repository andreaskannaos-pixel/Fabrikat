<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Siege</title>
<style>
:root{--bg:#070814;--panel:#11142a;--line:#262b52;--txt:#e8ecff;--dim:#8a91b8;--gold:#ffd23e;--hot:#ff3e8a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:8px;gap:8px}
#stage{position:relative;width:min(100%,calc((100vh - 120px) * 960 / 624));aspect-ratio:960/624;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 40px #3e5bff22}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
#bar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:stretch;width:min(100%,960px)}
.tb{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:86px;padding:6px 8px;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;cursor:pointer;transition:transform .08s,border-color .15s}
.tb:hover{transform:translateY(-2px)}
.tb .sw{width:22px;height:22px;border-radius:6px;box-shadow:0 0 12px currentColor}
.tb .nm{font-size:12px;font-weight:700}
.tb .cs{font-size:12px;color:var(--gold);font-weight:800}
.tb .hk{position:absolute;top:2px;left:5px;font-size:10px;color:var(--dim)}
.tb.sel{border-color:#fff;box-shadow:0 0 16px #fff6}
.tb.poor{opacity:.45}
.ctl{padding:6px 12px;background:var(--panel);border:2px solid var(--line);border-radius:10px;color:var(--txt);font:inherit;font-weight:800;cursor:pointer;min-width:52px}
.ctl.on{border-color:#7cff6b;color:#7cff6b}
#waveBtn{min-width:150px;font-size:16px;background:linear-gradient(135deg,#ff3e8a,#ff9a3c);border:none;color:#fff;text-shadow:0 1px 2px #0008}
#waveBtn.ready{animation:pulse 1s infinite}
#waveBtn:disabled{filter:grayscale(.8) brightness(.6);animation:none;cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #ff3e8a88}50%{box-shadow:0 0 0 8px #ff3e8a00}}
#panel{position:absolute;width:200px;background:#0d1024ee;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:13px;backdrop-filter:blur(4px);z-index:5}
#panel[hidden]{display:none}
#panel .ph{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
#panel .ph b{font-size:15px}
#pStats{color:var(--dim);line-height:1.5;margin-bottom:8px}
#pStats span{color:var(--txt);font-weight:700}
#panel .prow{display:flex;gap:6px;margin-bottom:6px}
#panel button{flex:1;padding:7px 4px;border-radius:8px;border:none;font:inherit;font-weight:800;cursor:pointer;color:#fff}
#pUp{background:linear-gradient(135deg,#2bd96b,#13a3ff)}
#pUp:disabled{filter:grayscale(1) brightness(.6);cursor:default}
#pSell{background:#3a2140}
#pMode{width:100%;background:#1d2350}
#overlay{position:fixed;inset:0;overflow:auto;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#05061099;backdrop-filter:blur(3px);z-index:10;text-align:center;padding:16px}
#overlay[hidden]{display:none}
h1{margin:0;font-size:clamp(40px,8vw,84px);font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#3ef0ff,#c77dff,#ff3e8a,#ffd23e,#3ef0ff);background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 4s linear infinite;filter:drop-shadow(0 0 18px #c77dff88)}
@keyframes hue{to{background-position:300%}}
.big{margin-top:18px;padding:14px 40px;font-size:22px;font-weight:900;border-radius:14px;border:none;color:#fff;background:linear-gradient(135deg,#ff3e8a,#c77dff);cursor:pointer;box-shadow:0 0 30px #ff3e8a66;animation:pulse 1.2s infinite}
.sub{color:var(--dim);margin-top:8px;font-size:14px;line-height:1.6}
.cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:16px;perspective:900px}
.card{position:relative;width:170px;min-height:220px;padding:14px 12px;border-radius:14px;background:#12162e;border:3px solid var(--rc);color:var(--txt);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 0 24px var(--rc);opacity:0;transform:rotateY(90deg) scale(.8);animation:flip .45s cubic-bezier(.2,1.6,.4,1) forwards;overflow:hidden}
.card:hover{transform:translateY(-6px) scale(1.04)!important}
.card .ic{font-size:44px;margin-top:6px}
.card .rn{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--rc)}
.card .cn{font-size:18px;font-weight:900}
.card .cd{font-size:14px;color:#cfd5ff}
@media (max-width:600px){.card{width:104px;min-height:170px;padding:10px 6px}.card .ic{font-size:32px}.card .cn{font-size:14px}.card .cd{font-size:12px}.cards{gap:8px}}
.card.leg{background:linear-gradient(160deg,#2a1d05,#12162e 60%)}
.card.leg::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,#fff6 50%,transparent 60%);animation:shine 1.6s infinite}
.card.epic{background:linear-gradient(160deg,#1e1033,#12162e 60%)}
@keyframes flip{to{opacity:1;transform:rotateY(0) scale(1)}}
@keyframes shine{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.reroll{margin-top:16px;padding:8px 18px;border-radius:10px;border:2px solid var(--gold);background:transparent;color:var(--gold);font:inherit;font-weight:800;cursor:pointer}
.reroll:disabled{opacity:.4;cursor:default}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;margin-top:14px;font-size:16px;text-align:left}
.stats b{color:var(--gold)}
.keys{font-size:12px;color:var(--dim);margin-top:14px;line-height:1.7}
kbd{background:#1d2350;border-radius:4px;padding:1px 5px;color:var(--txt);font-family:inherit}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="panel" hidden>
      <div class="ph"><b id="pName"></b><span id="pLvl"></span></div>
      <div id="pStats"></div>
      <div class="prow"><button id="pUp"></button><button id="pSell"></button></div>
      <button id="pMode"></button>
    </div>
    <div id="overlay"></div>
  </div>
  <div id="bar"></div>
</div>
<script>
'use strict';
// ---------- constants ----------
const W=960,HUDH=48,T=48,COLS=20,ROWS=12,H=HUDH+ROWS*T;
const GOLD_X=34,GOLD_Y=24;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=W*dpr;cv.height=H*dpr;
const $=id=>document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const easeOutBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// ---------- path ----------
const PATH_TILES=[[-1,1],[3,1],[3,9],[8,9],[8,3],[13,3],[13,9],[17,9],[17,5],[20.6,5]];
const pathPts=PATH_TILES.map(([c,r])=>({x:c*T+T/2,y:HUDH+r*T+T/2}));
const segs=[];let PATHLEN=0;
for(let i=0;i<pathPts.length-1;i++){const a=pathPts[i],b=pathPts[i+1],l=Math.hypot(b.x-a.x,b.y-a.y);segs.push({a,b,l,s:PATHLEN});PATHLEN+=l}
const PT={x:0,y:0};
function posAt(d,o=PT){for(const s of segs){if(d<=s.s+s.l){const k=Math.max(0,(d-s.s)/s.l);o.x=s.a.x+(s.b.x-s.a.x)*k;o.y=s.a.y+(s.b.y-s.a.y)*k;return o}}const L=segs[segs.length-1];o.x=L.b.x;o.y=L.b.y;return o}
const isPath=[];for(let r=0;r<ROWS;r++)isPath.push(new Array(COLS).fill(false));
for(let i=0;i<PATH_TILES.length-1;i++){
  let [c0,r0]=PATH_TILES[i],[c1,r1]=PATH_TILES[i+1];c0=Math.round(c0);c1=Math.min(COLS-1,Math.round(c1));
  const dc=Math.sign(c1-c0),dr=Math.sign(r1-r0);let c=c0,r=r0;
  for(;;){if(c>=0&&c<COLS&&r>=0&&r<ROWS)isPath[r][c]=true;if(c===c1&&r===r1)break;c+=dc;r+=dr}
}

// ---------- defs ----------
const TD={
  bolt:{name:'Blaster',cost:50,color:'#3ef0ff',range:2.6,rate:0.32,dmg:11,desc:'Fast single-target shots'},
  cannon:{name:'Cannon',cost:110,color:'#ff9a3c',range:2.4,rate:1.25,dmg:38,splash:1.15,desc:'Explosive splash'},
  frost:{name:'Frost',cost:80,color:'#8fb8ff',range:2.2,rate:0.9,dmg:5,slow:0.45,splash:0.95,desc:'Slows groups'},
  tesla:{name:'Tesla',cost:160,color:'#c77dff',range:2.5,rate:0.95,dmg:24,chain:4,desc:'Chain lightning'},
  laser:{name:'Laser',cost:220,color:'#ff3e8a',range:3.1,rate:0,dmg:26,desc:'Heats up, ignores armor'},
  mint:{name:'Mint',cost:200,color:'#ffd23e',range:1.7,rate:8,dmg:0,income:14,desc:'Prints gold; 2× kill gold nearby'},
};
const TKEYS=Object.keys(TD);
const ED={
  grunt:{hp:30,spd:58,gold:5,r:11,color:'#ff5470',shape:'circle',lives:1},
  runner:{hp:18,spd:115,gold:4,r:9,color:'#ffe14d',shape:'tri',lives:1},
  swarm:{hp:9,spd:82,gold:2,r:7,color:'#7cff6b',shape:'circle',lives:1},
  tank:{hp:150,spd:36,gold:16,r:16,color:'#ff8c42',shape:'square',armor:4,lives:2},
  splitter:{hp:70,spd:50,gold:8,r:14,color:'#4dd9ff',shape:'hex',lives:2},
  golden:{hp:60,spd:96,gold:90,r:12,color:'#ffd700',shape:'diamond',lives:1},
  boss:{hp:1400,spd:26,gold:350,r:28,color:'#ff2d55',shape:'spike',armor:8,lives:10},
};
const RAR=[{n:'COMMON',c:'#b8c0d8',m:1,w:60},{n:'RARE',c:'#3ea8ff',m:1.6,w:28},{n:'EPIC',c:'#c77dff',m:2.4,w:10},{n:'LEGENDARY',c:'#ffb020',m:4,w:2.5}];
let P;
function resetPerks(){P={dmg:1,rate:1,range:1,gold:1,crit:0.08,critMult:2,interest:0,chainBoom:0,discount:1,comboTime:2.2,golden:0.22}}
const CARDS=[
  {name:'Big Guns',icon:'💥',base:15,txt:v=>`+${v}% tower damage`,apply:v=>P.dmg*=1+v/100},
  {name:'Overclock',icon:'⚡',base:12,txt:v=>`+${v}% fire rate`,apply:v=>P.rate*=1+v/100},
  {name:'Eagle Eye',icon:'👁️',base:8,txt:v=>`+${v}% range`,apply:v=>P.range*=1+v/100},
  {name:'Greed',icon:'💰',base:20,txt:v=>`+${v}% gold from everything`,apply:v=>P.gold*=1+v/100},
  {name:'Lucky Strike',icon:'🍀',base:6,txt:v=>`+${v}% crit chance`,apply:v=>P.crit=Math.min(0.9,P.crit+v/100)},
  {name:'Brutality',icon:'🩸',base:50,txt:v=>`+${v}% crit damage`,apply:v=>P.critMult+=v/100},
  {name:'Compound',icon:'📈',base:4,txt:v=>`+${v}% interest on gold each wave`,apply:v=>P.interest+=v/100},
  {name:'Lifeline',icon:'❤️',base:5,txt:v=>`+${v} lives`,apply:v=>{G.lives+=v}},
  {name:'Chain Reaction',icon:'☢️',base:15,txt:v=>`Kills explode for ${v}% of max HP`,apply:v=>P.chainBoom+=v/100},
  {name:'Bulk Deal',icon:'🏷️',base:8,txt:v=>`Towers & upgrades ${v}% cheaper`,apply:v=>P.discount=Math.max(0.4,P.discount*(1-v/100))},
  {name:'Combo King',icon:'🔥',base:30,txt:v=>`Combo timer +${v}%`,apply:v=>P.comboTime*=1+v/100},
  {name:'Jackpot',icon:'🎰',base:150,txt:v=>`+${v} gold right now`,apply:v=>coinBurst(W/2,H/2,v,24)},
  {name:'Gold Rush',icon:'✨',base:15,txt:v=>`+${v}% golden enemy chance`,apply:v=>P.golden+=v/100},
];

// ---------- audio ----------
let AC=null,master=null,muted=store.get('ns_mute')==='1',noiseBuf=null;const lastS={};
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function gate(key,gap){if(!key)return true;const n=AC.currentTime;if(lastS[key]&&n-lastS[key]<gap)return false;lastS[key]=n;return true}
function tone(f,dur,type,vol,f2,key,gap=0.03,delay=0){
  if(!AC||muted||!gate(key,gap))return;
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.03);
}
function noise(dur,vol,freq,key,gap=0.05,delay=0){
  if(!AC||muted||!gate(key,gap))return;
  const t0=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type='lowpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t0);s.stop(t0+dur+0.03);
}
const PENTA=[0,2,4,7,9];
const noteF=i=>{i=Math.min(i,24);return 261.6*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12)};
const SFX={
  bolt:()=>tone(1300,0.05,'square',0.02,600,'bolt',0.05),
  cannon:()=>tone(170,0.1,'square',0.035,70,'cfire',0.08),
  boom:big=>{noise(big?0.6:0.3,big?0.35:0.16,big?400:700,'boom',0.06);tone(120,big?0.5:0.25,'sine',big?0.3:0.14,30,'boom2',0.06)},
  ice:()=>tone(2400,0.09,'triangle',0.03,1500,'ice',0.06),
  zap:()=>{tone(rand(250,650),0.12,'sawtooth',0.035,70,'zap',0.07);noise(0.07,0.05,5000,'zapn',0.07)},
  laser:()=>tone(rand(700,760),0.08,'sawtooth',0.012,null,'laser',0.07),
  kill:c=>tone(noteF(c-1),0.14,'triangle',0.08,null,'kill',0.022),
  coin:s=>tone(1050*Math.pow(2,Math.min(s,30)/30),0.08,'sine',0.05,null,'coin',0.028),
  crit:()=>tone(1800,0.06,'square',0.025,2600,'crit',0.06),
  place:()=>{tone(180,0.15,'sine',0.15,60);noise(0.12,0.1,1200)},
  up:lvl=>{[0,4,7,12].forEach((s,i)=>tone(392*Math.pow(2,(s+lvl*2)/12),0.18,'triangle',0.09,null,null,0,i*0.06))},
  max:()=>{[0,4,7,12,16,19,24].forEach((s,i)=>tone(392*Math.pow(2,s/12),0.25,'square',0.05,null,null,0,i*0.05));noise(0.5,0.1,3000,null,0,0.3)},
  star:()=>[12,16,19].forEach((s,i)=>tone(523*Math.pow(2,s/12),0.15,'sine',0.08,null,null,0,i*0.05)),
  leak:()=>{tone(90,0.4,'sawtooth',0.15,40,'leak',0.15);noise(0.3,0.15,300,'leakn',0.15)},
  wave:()=>{tone(220,0.25,'sawtooth',0.06,440);tone(330,0.25,'sawtooth',0.04,660,null,0,0.05)},
  clear:()=>[0,4,7,12,7,12,16].forEach((s,i)=>tone(523*Math.pow(2,s/12),0.2,'triangle',0.09,null,null,0,i*0.08)),
  boss:()=>{for(let i=0;i<4;i++){tone(60,0.35,'sawtooth',0.2,40,null,0,i*0.4);noise(0.3,0.25,200,null,0,i*0.4)}},
  milestone:n=>{[0,7,12,19].forEach((s,i)=>tone(330*Math.pow(2,(s+Math.min(n,6)*2)/12),0.2,'square',0.05,null,null,0,i*0.05))},
  card:r=>{const ch=[[0,4,7],[0,4,7,11],[0,4,7,11,14],[0,4,7,11,14,19,24]][r];ch.forEach((s,i)=>tone(392*Math.pow(2,s/12),0.6,'triangle',0.07,null,null,0,i*0.07))},
  jackpot:()=>{for(let i=0;i<14;i++)tone(800+i*90,0.09,'square',0.04,null,null,0,i*0.045)},
  sell:()=>tone(900,0.12,'sine',0.08,400),
  lose:()=>[12,7,3,0].forEach((s,i)=>tone(220*Math.pow(2,s/12),0.45,'sawtooth',0.08,null,null,0,i*0.25)),
  click:()=>tone(700,0.04,'square',0.03),
};

// ---------- glow sprite cache ----------
const glowCache={};
function glowSprite(col){
  if(glowCache[col])return glowCache[col];
  const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,col);gr.addColorStop(0.35,col+'88');gr.addColorStop(1,col+'00');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return glowCache[col]=c;
}
function glow(x,y,r,col,a=1){ctx.globalAlpha=a;ctx.drawImage(glowSprite(col),x-r,y-r,r*2,r*2);ctx.globalAlpha=1}

// ---------- background ----------
const bg=document.createElement('canvas');bg.width=W*dpr;bg.height=H*dpr;
(function(){
  const g=bg.getContext('2d');g.scale(dpr,dpr);
  const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#0a0b1e');gr.addColorStop(1,'#0c0716');g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){if(isPath[r][c])continue;g.fillStyle=(r+c)%2?'#10132b':'#0e1126';rr(g,c*T+2,HUDH+r*T+2,T-4,T-4,6);g.fill()}
  g.lineCap='round';g.lineJoin='round';
  const line=()=>{g.beginPath();pathPts.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y))};
  line();g.strokeStyle='#3e5bff22';g.lineWidth=T+10;g.stroke();
  line();g.strokeStyle='#2a3170';g.lineWidth=T-2;g.stroke();
  line();g.strokeStyle='#161a3a';g.lineWidth=T-8;g.stroke();
  g.fillStyle='#06071099';g.fillRect(0,0,W,HUDH);g.fillStyle='#262b52';g.fillRect(0,HUDH-1,W,1);
})();
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

// ---------- state ----------
let G=null,best=+(store.get('ns_best')||0),sel=null,build=null,hover=null;
function newGame(){
  resetPerks();
  G={gold:250,shownGold:250,lives:20,wave:0,score:0,kills:0,combo:0,comboT:0,comboPulse:0,maxCombo:0,nextMile:0,
    towers:[],enemies:[],proj:[],parts:[],texts:[],coins:[],bolts:[],rings:[],booms:[],banners:[],queue:[],
    grid:Array.from({length:ROWS},()=>new Array(COLS).fill(null)),
    spawnT:0,shake:0,flash:0,flashC:'255,255,255',hitstop:0,slowmo:0,speed:1,paused:false,over:false,started:true,
    auto:false,autoT:0,waveActive:false,waveLeaked:false,cardsGiven:0,cardT:0,rerollCost:40,coinStreak:0,coinStreakT:0,goldPulse:0,time:0};
  sel=null;build=null;hidePanel();refreshBar();
}

// ---------- helpers ----------
const costOf=k=>Math.round(TD[k].cost*P.discount);
const upCost=t=>Math.round(TD[t.type].cost*(0.7+0.45*t.lvl)*Math.pow(1.4,Math.max(0,t.lvl-4))*P.discount);
const hpMul=w=>(1+0.22*(w-1)+0.02*(w-1)*(w-1))*Math.pow(1.07,Math.max(0,w-12));
const goldMul=w=>1+0.04*(w-1);
const STAR_AT=[15,50,150,400,1000];
function tStats(t){
  const d=TD[t.type],L=t.lvl-1;

// ---------- waves ----------
function makeWave(w){
  const q=[],add=(type,delay)=>q.push({type,delay});
  const n=Math.round(6+w*1.7),gap=Math.max(0.26,0.9-w*0.02);
  const pool=[['grunt',10]];
  if(w>=2)pool.push(['runner',w<5?3:6]);if(w>=4)pool.push(['swarm',5]);if(w>=6)pool.push(['tank',w<12?3:6]);if(w>=8)pool.push(['splitter',4]);
  const tw=pool.reduce((s,p)=>s+p[1],0);
  const rush=w%5===0&&w%10!==0?pool[Math.floor(Math.random()*pool.length)][0]:null;
  for(let i=0;i<n;i++){
    let t=rush;if(!t){let r=Math.random()*tw;for(const p of pool){if((r-=p[1])<0){t=p[0];break}}t=t||'grunt'}
    if(t==='swarm'){for(let k=0;k<4;k++)add('swarm',0.12);q[q.length-1].delay=gap}
    else add(t,gap*(t==='tank'?1.4:t==='runner'?0.55:rush?0.6:1));
  }
  if(Math.random()<P.golden)q.splice(Math.floor(Math.random()*q.length),0,{type:'golden',delay:gap});
  if(w%10===0)for(let i=0;i<w/10;i++)add('boss',2.5);
  return q;
}
function startWave(){
  if(!G||G.over||G.paused||G.queue.length)return;
  audioInit();
  if(G.waveActive&&G.enemies.length){const b=Math.round(10+G.wave*3);coinBurst(W-120,HUDH+40,b,6);text(W-120,HUDH+60,'EARLY +'+b,'#7cff6b',18,1.2)}
  G.wave++;G.queue=makeWave(G.wave);G.spawnT=0;G.waveActive=true;G.waveLeaked=false;G.autoT=0;
  if(G.wave%10===0){banner('⚠ BOSS WAVE ⚠','WAVE '+G.wave,'#ff2d55',60,2.4);SFX.boss();shake(8)}
  else banner('WAVE '+G.wave,G.wave%5===0?'RUSH!':'','#3ef0ff',46,1.3),SFX.wave();
  refreshBar();
}
function spawnEnemy(type,d=0,hpScale=1){

    r:def.r,armor:(def.armor||0)*(1+w*0.05),gold:def.gold*goldMul(w)*hpScale,lives:def.lives,slow:0,slowT:0,flash:0,age:0,dead:false,x:0,y:0,wob:Math.random()*6};

// ---------- combat ----------
function hurt(e,dmg,src,o){
  if(e.dead)return 0;o=o||{};
  let crit=false;
  if(!o.noCrit&&Math.random()<P.crit){crit=true;dmg*=P.critMult}
  if(!o.pierce)dmg=Math.max(dmg*0.25,dmg-e.armor);
  e.hp-=dmg;e.flash=0.07;
  if(!o.silent)dmgText(e.x,e.y-e.r,dmg,crit);
  if(crit){SFX.crit();burst(e.x,e.y,'#ffe14d',6,220,2.5,0.3)}
  if(e.hp<=0)kill(e,src);
  return dmg;
}
function dmgText(x,y,v,crit){
  const n=v>=1000?(v/1000).toFixed(1)+'k':Math.max(1,Math.round(v));
  if(crit)text(x+rand(-10,10),y,n+'!','#ffe14d',22+Math.min(14,Math.log10(v+1)*4),0.75,-70);
  else text(x+rand(-10,10),y,''+n,'#ffffff',13,0.55,-45);
}
const MILES=[[10,'NICE!'],[25,'GREAT!'],[50,'AWESOME!!'],[100,'UNSTOPPABLE!!!'],[200,'GODLIKE'],[400,'TRANSCENDENT'],[750,'BEYOND MORTAL'],[1500,'∞ ASCENDED ∞']];
function kill(e,src){
  if(e.dead)return;e.dead=true;G.kills++;
  G.combo++;G.comboT=P.comboTime;G.comboPulse=1;if(G.combo>G.maxCombo)G.maxCombo=G.combo;

  let gm=P.gold*(1+Math.min(2,G.combo*0.02));
  for(const t of G.towers)if(t.type==='mint'){const r=tStats(t).range;if((t.x-e.x)**2+(t.y-e.y)**2<r*r){gm*=2;break}}
  const g=Math.max(1,Math.round(e.gold*gm));
  coinBurst(e.x,e.y,g,Math.min(10,1+Math.floor(g/4)));
  G.score+=Math.round(g*10*(1+G.combo*0.05));
  burst(e.x,e.y,e.def.color,10+e.r,180+e.r*6,3,0.55);burst(e.x,e.y,'#ffffff',4,120,2,0.3);
  ring(e.x,e.y,e.r*2.2,e.def.color,0.3,3);
  SFX.kill(G.combo);
  if(src){src.kills++;if(src.stars<STAR_AT.length&&src.kills>=STAR_AT[src.stars]){src.stars++;text(src.x,src.y-30,'★ RANK UP','#ffd23e',16,1.2);ring(src.x,src.y,40,'#ffd23e',0.5);SFX.star()}}
  if(e.type==='splitter')for(let i=0;i<3;i++){const c=spawnEnemy('swarm',Math.max(0,e.d-10+i*10),0.9);c.gold*=0.5}
  if(P.chainBoom>0)G.booms.push({x:e.x,y:e.y,dmg:e.maxHp*P.chainBoom,t:0.08});
  if(e.type==='golden'){banner('JACKPOT!','+'+g+' gold','#ffd700',64,1.6);SFX.jackpot();G.slowmo=0.6;shake(10);G.flash=0.25;G.flashC='255,215,0';burst(e.x,e.y,'#ffd700',60,420,4,1)}
  if(e.type==='boss'){banner('BOSS DOWN!','+'+g+' gold','#ff2d55',72,2.2);SFX.boom(true);G.hitstop=0.12;G.slowmo=0.9;shake(18);G.flash=0.4;G.flashC='255,255,255';
    for(let i=0;i<5;i++)ring(e.x,e.y,80+i*40,i%2?'#ff2d55':'#ffd23e',0.5+i*0.12,6);burst(e.x,e.y,'#ff2d55',120,600,5,1.2);burst(e.x,e.y,'#ffd23e',80,450,4,1.2)}
  else if(e.r>=14)shake(3);
}
function explode(x,y,dmg,rad,src,col){
  for(const e of G.enemies){if(e.dead)continue;const d=Math.hypot(e.x-x,e.y-y);if(d<rad+e.r)hurt(e,dmg*(1-0.5*Math.min(1,d/rad)),src)}
  ring(x,y,rad,col,0.35,5);burst(x,y,col,26,rad*5,3.5,0.5);burst(x,y,'#ffffff',8,rad*3,2.5,0.25);
  for(let i=0;i<6;i++)part(x+rand(-8,8),y+rand(-8,8),rand(-30,30),rand(-50,-10),'#555a80',0.8,8,1);
  shake(Math.min(9,rad/14));SFX.boom(false);
}
function findTarget(t,range){
  let best=null,bv=-Infinity;const r2=range*range;
  for(const e of G.enemies){
    if(e.dead)continue;const d2=(e.x-t.x)**2+(e.y-t.y)**2;if(d2>r2)continue;
    const v=t.mode===0?e.d:t.mode===1?e.hp:t.mode===2?-e.d:-d2;
    if(v>bv){bv=v;best=e}
  }
  return best;
}
const MODES=['First','Strongest','Last','Closest'];
function fire(t,tg,s){
  const d=TD[t.type],c=Math.cos(t.ang),sn=Math.sin(t.ang),mx=t.x+c*20,my=t.y+sn*20;
  burst(mx,my,d.color,4,140,2,0.15);
  if(t.type==='bolt'){
    G.proj.push({k:'bolt',x:mx,y:my,tg,spd:780,dmg:s.dmg,col:d.color,src:t});
    if(t.lvl>=5){let o=null;for(const e of G.enemies)if(!e.dead&&e!==tg&&(e.x-t.x)**2+(e.y-t.y)**2<s.range*s.range){o=e;break}G.proj.push({k:'bolt',x:mx,y:my,tg:o||tg,spd:780,dmg:s.dmg,col:'#ffffff',src:t})}
    SFX.bolt();
  }else if(t.type==='cannon'){
    const sf=tg.slowT>0?1-tg.slow:1,p=posAt(tg.d+tg.spd*sf*0.5,{x:0,y:0});
    G.proj.push({k:'shell',x:mx,y:my,sx:mx,sy:my,tx:p.x,ty:p.y,t:0,dur:0.5,dmg:s.dmg,rad:d.splash*T*(1+0.1*(t.lvl-1)),src:t,cluster:t.lvl>=5});
    SFX.cannon();
  }else if(t.type==='frost'){
    G.proj.push({k:'ice',x:mx,y:my,tg,spd:560,dmg:s.dmg,col:d.color,src:t,slow:Math.min(0.75,d.slow+0.06*(t.lvl-1)),rad:d.splash*T,freeze:t.lvl>=5});
    SFX.ice();
  }else if(t.type==='tesla'){
    let cur=tg,dmg=s.dmg;const hit=new Set([tg]),pts=[[t.x,t.y-12]],n=d.chain+(t.lvl-1)+(t.lvl>=5?3:0);
    for(let i=0;i<n;i++){
      pts.push([cur.x,cur.y]);burst(cur.x,cur.y,d.color,5,160,2,0.2);hurt(cur,dmg,t);dmg*=0.88;
      let nb=null,bd=(T*1.9)**2;
      for(const e of G.enemies){if(e.dead||hit.has(e))continue;const q=(e.x-cur.x)**2+(e.y-cur.y)**2;if(q<bd){bd=q;nb=e}}
      if(!nb)break;hit.add(nb);cur=nb;
    }
    G.bolts.push({pts,t:0,life:0.16,col:d.color});SFX.zap();
  }
}

// ---------- update ----------
function update(dt){
  G.time+=dt;
  if(G.queue.length){G.spawnT-=dt;while(G.spawnT<=0&&G.queue.length){const it=G.queue.shift();spawnEnemy(it.type);G.spawnT+=it.delay}if(!G.queue.length)refreshBar()}
  for(const e of G.enemies){
    if(e.dead)continue;
    e.slowT-=dt;e.flash-=dt;e.age+=dt;
    if(e.stun>0){e.stun-=dt;continue}
    e.d+=e.spd*(e.slowT>0?1-e.slow:1)*dt;posAt(e.d,e);
    if(e.type==='golden'&&Math.random()<0.5)part(e.x+rand(-8,8),e.y+rand(-8,8),0,-30,'#ffd700',0.5,2.5,1);
    if(e.type==='boss'&&Math.random()<0.4)part(e.x+rand(-20,20),e.y+rand(-20,20),0,-20,'#ff2d55',0.6,4,1);
    if(e.d>=PATHLEN-6)leak(e);
  }
  for(let i=G.booms.length-1;i>=0;i--){const b=G.booms[i];b.t-=dt;if(b.t<=0){G.booms.splice(i,1);explode(b.x,b.y,b.dmg,T*1.1,null,'#7cff6b')}}
  for(const t of G.towers){
    t.age+=dt;t.recoil=Math.max(0,t.recoil-dt*6);
    const s=tStats(t),d=TD[t.type];
    if(t.type==='mint'){
      t.ang+=dt*2;
      if(G.waveActive){t.cd-=dt;if(t.cd<=0){t.cd=d.rate/P.rate;const v=Math.round(d.income*(1+0.6*(t.lvl-1))*P.gold);coinBurst(t.x,t.y,v,Math.min(10,3+t.lvl));text(t.x,t.y-26,'+'+v,'#ffd23e',18,1);ring(t.x,t.y,36,'#ffd23e',0.4);tone(1320,0.12,'sine',0.06,1980,'mint',0.1)}}
      continue;
    }
    if(t.type==='laser'){
      let tg=t.beam;
      if(!tg||tg.dead||(tg.x-t.x)**2+(tg.y-t.y)**2>s.range*s.range){tg=findTarget(t,s.range);if(tg!==t.beam)t.heat=1;t.beam=tg}
      if(tg){
        t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);t.heat=Math.min(4+(t.lvl>=5?2:0),t.heat+dt*1.2);
        t.acc+=hurt(tg,s.dmg*t.heat*dt,t,{silent:true,noCrit:true,pierce:true});t.accT+=dt;
        if(t.accT>0.3||tg.dead){dmgText(tg.x,tg.y-tg.r,t.acc,t.heat>=3.5);t.acc=0;t.accT=0}
        if(Math.random()<0.6)part(tg.x,tg.y,rand(-120,120),rand(-120,120),'#ff3e8a',0.25,2.5);
        SFX.laser();
      }else t.heat=Math.max(1,t.heat-dt*2);
      continue;
    }
    if(t.type==='frost')t.spin=(t.spin||0)+dt;
    t.cd-=dt;if(t.cd>0)continue;
    const tg=findTarget(t,s.range);if(!tg){t.cd=0;continue}
    t.ang=Math.atan2(tg.y-t.y,tg.x-t.x);t.cd=s.rate;t.recoil=1;fire(t,tg,s);
  }
  for(const p of G.proj){
    if(p.k==='shell'){
      p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.sx+(p.tx-p.sx)*k;p.y=p.sy+(p.ty-p.sy)*k-Math.sin(k*Math.PI)*70;
      part(p.x,p.y,rand(-20,20),rand(-20,20),'#ff9a3c',0.3,2.5,2);
      if(k>=1){p.dead=true;explode(p.tx,p.ty,p.dmg,p.rad,p.src,'#ff9a3c');
        if(p.cluster)for(let i=0;i<3;i++){const a=i*2.094+rand(0,1);G.proj.push({k:'shell',x:p.tx,y:p.ty,sx:p.tx,sy:p.ty,tx:p.tx+Math.cos(a)*40,ty:p.ty+Math.sin(a)*40,t:0,dur:0.3,dmg:p.dmg*0.5,rad:p.rad*0.7,src:p.src,cluster:false})}}
      continue;
    }
    let tg=p.tg;
    if(!tg||tg.dead){tg=null;let bd=90*90;for(const e of G.enemies){if(e.dead)continue;const q=(e.x-p.x)**2+(e.y-p.y)**2;if(q<bd){bd=q;tg=e}}p.tg=tg;if(!tg){p.dead=true;burst(p.x,p.y,p.col,3,60,2,0.2);continue}}
    const dx=tg.x-p.x,dy=tg.y-p.y,dist=Math.hypot(dx,dy),step=p.spd*dt;
    p.ang=Math.atan2(dy,dx);
    if(dist<=step+tg.r*0.6){
      p.dead=true;
      if(p.k==='ice'){
        for(const e of G.enemies){if(e.dead)continue;if((e.x-tg.x)**2+(e.y-tg.y)**2<(p.rad+e.r)**2){e.slow=Math.max(e.slowT>0?e.slow:0,p.slow);e.slowT=1.8;if(p.freeze&&Math.random()<0.15&&e.type!=='boss')e.stun=0.6}}
        hurt(tg,p.dmg,p.src);ring(tg.x,tg.y,p.rad,'#bfe3ff',0.3,3);burst(tg.x,tg.y,'#cfe8ff',10,160,2.5,0.4);
      }else{hurt(tg,p.dmg,p.src);burst(tg.x,tg.y,p.col,5,150,2,0.2)}
    }else{p.x+=dx/dist*step;p.y+=dy/dist*step}
  }
  G.proj=G.proj.filter(p=>!p.dead);
  G.enemies=G.enemies.filter(e=>!e.dead);
  for(const q of G.parts){q.t+=dt;const f=Math.exp(-q.drag*dt);q.vx*=f;q.vy*=f;q.vy+=q.grav*dt;q.x+=q.vx*dt;q.y+=q.vy*dt}
  G.parts=G.parts.filter(q=>q.t<q.life);
  for(const r of G.rings)r.t+=dt;G.rings=G.rings.filter(r=>r.t<r.life);
  for(const b of G.bolts)b.t+=dt;G.bolts=G.bolts.filter(b=>b.t<b.life);
  for(const x of G.texts){x.t+=dt;x.y+=x.vy*dt;x.vy*=Math.exp(-2*dt)}G.texts=G.texts.filter(x=>x.t<x.life);
  for(const b of G.banners)b.t+=dt;G.banners=G.banners.filter(b=>b.t<b.life);
  for(const c of G.coins){
    c.t+=dt;if(c.t<0)continue;
    if(c.t<0.32){const f=Math.exp(-4*dt);c.vx*=f;c.vy*=f;c.vy+=300*dt}
    else{const dx=GOLD_X-c.x,dy=GOLD_Y-c.y,d=Math.hypot(dx,dy),sp=400+(c.t-0.32)*2400;c.vx+=(dx/d*sp-c.vx)*Math.min(1,dt*9);c.vy+=(dy/d*sp-c.vy)*Math.min(1,dt*9);if(d<18){c.dead=true;addGold(c.val);G.coinStreak++;G.coinStreakT=0.35;SFX.coin(G.coinStreak)}}
    c.x+=c.vx*dt;c.y+=c.vy*dt;
  }
  G.coins=G.coins.filter(c=>!c.dead);
  G.coinStreakT-=dt;if(G.coinStreakT<=0)G.coinStreak=0;
  if(G.combo>0){G.comboT-=dt;if(G.comboT<=0){
    if(G.combo>=5){const b=Math.round(Math.min(Math.pow(G.combo,1.4)*0.6,60+G.wave*40)*P.gold);coinBurst(W/2,HUDH+44,b,Math.min(30,4+G.combo/4));text(W/2,HUDH+80,G.combo+'x COMBO  +'+b,'#ffd23e',22+Math.min(18,G.combo/8),1.6,-30)}
    G.combo=0;G.nextMile=0}}
  if(G.waveActive&&!G.queue.length&&!G.enemies.length)waveClear();
  if(G.cardT>0){G.cardT-=dt;if(G.cardT<=0)showCards()}
  else if(G.auto&&!G.waveActive&&!G.over&&G.wave>0){G.autoT+=dt;if(G.autoT>1.6)startWave()}
}
function leak(e){
  e.dead=true;G.lives-=e.lives;G.waveLeaked=true;shake(12);G.flash=0.3;G.flashC='255,40,80';
  text(W-60,e.y-20,'-'+e.lives+' ♥','#ff3e5a',24,1.2);burst(W-10,e.y,'#ff3e5a',30,300,3,0.6);SFX.leak();
  if(G.lives<=0){G.lives=0;gameOver()}
}
function waveClear(){
  G.waveActive=false;

    <button class="big" id="again">PLAY AGAIN</button>`,()=>{$('again').onclick=()=>{hideOverlay();newGame();SFX.click()}}),900);

let curCards=[];
function rollCards(){
  const pool=CARDS.slice(),out=[];
  for(let i=0;i<3;i++){
    const c=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    let r=Math.random()*RAR.reduce((s,x)=>s+x.w,0),ri=0;for(;ri<RAR.length-1;ri++){if((r-=RAR[ri].w)<0)break}
    out.push({c,ri,v:Math.round(c.base*RAR[ri].m)});
  }
  return out;
}
function showCards(){
  G.paused=true;curCards=rollCards();
  const top=Math.max(...curCards.map(x=>x.ri));
  showOverlay(`<h1 style="font-size:44px">CHOOSE A POWER</h1><div class="sub">Wave ${G.wave} reward</div>
    <div class="cards">${curCards.map((x,i)=>{const R=RAR[x.ri];return`<button class="card ${x.ri===3?'leg':x.ri===2?'epic':''}" data-i="${i}" style="--rc:${R.c};animation-delay:${i*0.15}s"><div class="rn">${R.n}</div><div class="ic">${x.c.icon}</div><div class="cn">${x.c.name}</div><div class="cd">${x.c.txt(x.v)}</div></button>`}).join('')}</div>
    <button class="reroll" id="reroll" ${G.gold<G.rerollCost?'disabled':''}>↻ Reroll (${G.rerollCost} gold)</button>`,()=>{
    document.querySelectorAll('.card').forEach(b=>b.onclick=()=>pickCard(+b.dataset.i));
    $('reroll').onclick=()=>{if(G.gold<G.rerollCost)return;G.gold-=G.rerollCost;G.rerollCost=Math.round(G.rerollCost*1.6);SFX.click();showCards()};
  });
  setTimeout(()=>SFX.card(top),200);
}
function pickCard(i){
  const x=curCards[i];if(!x)return;
  G.cardsGiven++;hideOverlay();G.paused=false;
  x.c.apply(x.v);SFX.up(x.ri+2);
  banner(x.c.name.toUpperCase(),x.c.txt(x.v),RAR[x.ri].c,40,1.5);
  for(const t of G.towers){ring(t.x,t.y,30,RAR[x.ri].c,0.5);burst(t.x,t.y,RAR[x.ri].c,8,160,2.5,0.5)}
  refreshBar();if(sel)showPanel(sel);
  if(Math.floor(G.wave/3)>G.cardsGiven)G.cardT=0.4;
}

function drawEnemy(e,time){

const blueCache={};function mixBlue(c){if(blueCache[c])return blueCache[c];const n=parseInt(c.slice(1),16),R=n>>16,Gc=n>>8&255,B=n&255;return blueCache[c]=`rgb(${(R*0.45+90)|0},${(Gc*0.5+120)|0},255)`}

  if(!t)return;const c=upCost(t);if(G.gold<c){tone(140,0.12,'square',0.05);return}
  G.gold-=c;t.spent+=c;t.lvl++;t.age=0.12;
  const col=TD[t.type].color;ring(t.x,t.y,46,col,0.5,5);ring(t.x,t.y,26,'#ffffff',0.3,3);burst(t.x,t.y,col,30,260,3,0.6);
  if(t.lvl===5){banner('MAX POWER!',TD[t.type].name+' unlocked its ultimate','#ffd23e',44,1.4);SFX.max();shake(6);G.flash=0.15;G.flashC='255,210,62';for(let i=0;i<3;i++)ring(t.x,t.y,70+i*30,'#ffd23e',0.5+i*0.15,4)}
  else{text(t.x,t.y-30,'LEVEL '+t.lvl+'!',col,20+Math.min(16,Math.max(0,t.lvl-5)*2),1.1);SFX.up(Math.min(t.lvl,12))}
  if(t===sel)showPanel(t);refreshBar();
}
function sell(t){
  if(!t)return;const v=Math.round(t.spent*0.7);
  G.towers.splice(G.towers.indexOf(t),1);G.grid[t.r][t.c]=null;coinBurst(t.x,t.y,v,8);burst(t.x,t.y,TD[t.type].color,20,200,3,0.5);SFX.sell();
  sel=null;hidePanel();refreshBar();
}
const ULT={bolt:'Twin shots',cannon:'Cluster bombs',frost:'Freezes solid',tesla:'+3 chains',laser:'Overheat ×6',mint:'—'};
function showPanel(t){
  const p=$('panel'),d=TD[t.type],s=tStats(t);p.hidden=false;
  $('pName').textContent=d.name;$('pName').style.color=d.color;$('pLvl').textContent=(t.lvl>=5?'★ ':'')+'Lv '+t.lvl;
  const dm=t.type==='mint'?`Income <span>${Math.round(d.income*(1+0.6*(t.lvl-1))*P.gold)}</span> / ${(d.rate/P.rate).toFixed(1)}s`:t.type==='laser'?`DPS <span>${s.dmg.toFixed(0)}</span>–<span>${(s.dmg*(t.lvl>=5?6:4)).toFixed(0)}</span>`:`Damage <span>${s.dmg.toFixed(0)}</span> • Rate <span>${(1/s.rate).toFixed(1)}/s</span>`;
  $('pStats').innerHTML=`${dm}<br>Range <span>${(s.range/T).toFixed(1)}</span> • Kills <span>${t.kills}</span> ${'★'.repeat(t.stars)}<br>${t.lvl<5?'Lv 5: <span>'+ULT[t.type]+'</span>':'<span style="color:#ffd23e">Ultimate: '+ULT[t.type]+'</span>'}`;
  const up=$('pUp'),uc=upCost(t);up.textContent='Upgrade '+uc.toLocaleString()+' (U)';up.disabled=G.gold<uc;
  $('pSell').textContent='Sell '+Math.round(t.spent*0.7);
  const pm=$('pMode');pm.hidden=t.type==='mint';pm.textContent='Target: '+MODES[t.mode]+' (T)';
  const sc=cv.clientWidth/W;let lx=(t.x+30)*sc,ly=(t.y-40)*sc;
  if(lx+210>cv.clientWidth)lx=(t.x-30)*sc-205;ly=clamp(ly,4,cv.clientHeight-p.offsetHeight-4);
  p.style.left=lx+'px';p.style.top=ly+'px';
}
function hidePanel(){$('panel').hidden=true}
$('pUp').onclick=()=>upgrade(sel);
$('pSell').onclick=()=>sell(sel);
$('pMode').onclick=()=>{if(sel){sel.mode=(sel.mode+1)%4;SFX.click();showPanel(sel)}};
function showOverlay(html,bind){const o=$('overlay');o.innerHTML=html;o.hidden=false;bind&&bind()}
function hideOverlay(){$('overlay').hidden=true}

function tileAt(ev){const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;return{c:Math.floor(x/T),r:Math.floor((y-HUDH)/T),x,y}}
cv.addEventListener('pointermove',ev=>{const t=tileAt(ev);hover=t.r>=0?t:null});
cv.addEventListener('pointerleave',()=>hover=null);
cv.addEventListener('pointerdown',ev=>{
  if(!G||G.over||G.paused)return;audioInit();
  const t=tileAt(ev);hover=t.r>=0?t:null;
  if(ev.button===2){build=null;sel=null;hidePanel();refreshBar();return}
  if(t.r<0||t.r>=ROWS||t.c<0||t.c>=COLS)return;
  const tw=G.grid[t.r][t.c];
  if(tw){build=null;sel=tw;showPanel(tw);SFX.click();refreshBar();return}
  if(build){place(t.c,t.r);return}
  sel=null;hidePanel();
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',ev=>{
  if(!G)return;const k=ev.key.toLowerCase();
  if(k>='1'&&k<='6'){selectBuild(TKEYS[+k-1]);return}
  if(k==='escape'){build=null;sel=null;hidePanel();refreshBar()}
  else if(k===' '){ev.preventDefault();if(!G.paused)startWave()}
  else if(k==='u'&&sel)upgrade(sel);
  else if(k==='s'&&sel)sell(sel);
  else if(k==='t'&&sel){sel.mode=(sel.mode+1)%4;showPanel(sel)}
  else if(k==='f')cycleSpeed();
  else if(k==='a'){G.auto=!G.auto;refreshBar()}
  else if(k==='m'){muted=!muted;store.set('ns_mute',muted?'1':'0');refreshBar()}
  else if(k==='p'&&!G.over&&$('overlay').hidden){G.paused=!G.paused}
});

// ---------- loop ----------
let last=performance.now(),barT=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!G.paused&&!G.over){
    if(G.hitstop>0)G.hitstop-=dt;
    else{const sdt=dt*G.speed*(G.slowmo>0?0.35:1);if(G.slowmo>0)G.slowmo-=dt;const n=Math.ceil(sdt/0.017),h=sdt/n;for(let i=0;i<n;i++)update(h)}
  }
  if(G){
    G.shake*=Math.exp(-dt*10);G.flash=Math.max(0,G.flash-dt*1.5);G.goldPulse=Math.max(0,G.goldPulse-dt*4);G.comboPulse=Math.max(0,G.comboPulse-dt*5);
    G.shownGold+=(G.gold-G.shownGold)*Math.min(1,dt*12);if(Math.abs(G.gold-G.shownGold)<0.5)G.shownGold=G.gold;
    barT-=dt;if(barT<=0){barT=0.2;refreshBar();if(sel&&!$('panel').hidden)showPanel(sel)}
  }
  render(now/1000);
}
showOverlay(`<h1>NEON SIEGE</h1><div class="sub">Build towers. Chain combos. Crit everything. Pick powers every 3 waves.<br>Best wave: <b style="color:#ffd23e">${best}</b></div>
  <button class="big" id="play">PLAY</button>
  <div class="keys"><kbd>1</kbd>–<kbd>6</kbd> build • click tower to upgrade • <kbd>Space</kbd> wave • <kbd>U</kbd> upgrade • <kbd>S</kbd> sell • <kbd>T</kbd> target • <kbd>F</kbd> speed • <kbd>A</kbd> auto • <kbd>P</kbd> pause • <kbd>M</kbd> mute • right-click cancel</div>`,
  ()=>{$('play').onclick=()=>{audioInit();hideOverlay();newGame();SFX.wave()}});
refreshBar();
requestAnimationFrame(frame);
</script>
</body>
</html>
