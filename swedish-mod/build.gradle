plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = "svenskacraft" }

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Tests only, not shipped in the mod jar
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging { events "failed"; exceptionFormat "full" }
}

// Build for another Minecraft version with e.g.
//   ./gradlew build -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2
version = "${project.version}+${project.minecraft_version}"

processResources {
	def version = project.version
	def mc = project.minecraft_version
	inputs.property "version", version
	inputs.property "minecraft", mc
	filesMatching("fabric.mod.json") { expand "version": version, "minecraft": mc }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
